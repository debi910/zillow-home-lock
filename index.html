      <header class="about-hero">
        <div class="eyebrow">How Home Lock works</div>
        <h1>Stop rental scams before a renter ever sees them</h1>
        <p>Scammers copy a real home's photos, list it far below market, and collect a deposit by Zelle or wire. Renters find an empty lockbox, and the owner finds out from a neighbor. Today Zillow shows the same generic warning on every listing and removes fakes after someone reports them.</p>
      </header>

            </g>

            <text x="872" y="66" text-anchor="middle" font-weight="700" fill="#5a2ca0">Held</text>
            <text x="872" y="86" text-anchor="middle" font-size="12" fill="#5a2ca0">owner gets an alert</text>
            <rect x="795" y="195" width="155" height="70" rx="14" fill="#e8f6ee" stroke="#bfe6cf"/>

      <section class="feature-grid">
        <article class="feature reveal"><span class="f-ic" data-icon="building"></span><h3>Lister vs. owner of record</h3><p>The lister's name is matched against the owner in Travis Central Appraisal District records, handling formats like "LAST FIRST &amp; SPOUSE". Renters only see a masked name.</p></article>
        <article class="feature reveal"><span class="f-ic" data-icon="mail"></span><h3>Is the owner living there?</h3><p>If the county sends the owner's tax mail to the house itself, it's probably their home, not a vacant rental, and "I'm out of the country" doesn't add up.</p></article>
        <article class="feature reveal"><span class="f-ic" data-icon="camera"></span><h3>Photos reused from another listing</h3><p>Photos are matched against the home's earlier listings even after cropping, recoloring or a stamped caption, using normalized thumbnails and cross-correlation.</p></article>
        <article class="feature reveal"><span class="f-ic" data-icon="tag"></span><h3>Price vs. area rent</h3><p>Rent is compared with HUD's FY2027 Small Area Fair Market Rent for the ZIP and bedroom count. Zillow would use its Rent Zestimate.</p></article>
        <article class="feature reveal"><span class="f-ic" data-icon="chat"></span><h3>Scam language</h3><p>Wire, Zelle or gift cards; "out of the country"; "keys will be mailed"; moving to WhatsApp; a deposit before a showing.</p></article>
        <article class="feature reveal"><span class="f-ic" data-icon="lock"></span><h3>Owner's Home Lock</h3><p>Owners verify against county records plus a code mailed to the property, then lock the home. Their own manager can be approved in one tap.</p></article>
      </section>

      <section class="ship reveal">
        <h2>Why Zillow can ship it</h2>
        <p>It builds on things Zillow already has: home claiming, an archive of past listing photos, and the Rent Zestimate. County owner records are public in every U.S. county. Rollout can start with owner-occupied homes in the metros with the most scam reports.</p>
