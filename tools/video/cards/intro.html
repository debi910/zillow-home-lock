<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><style>
.stage { position: absolute; inset: 0; display: grid; place-items: center; }
.hook { text-align: center; font-weight: 800; font-size: 96px; letter-spacing: -2px; line-height: 1.08; }
.hook div:nth-child(3) { color: var(--bad); }
.scene { position: absolute; inset: 0; display: grid; grid-template-columns: 1.15fr 1fr; gap: 64px; align-items: center; padding: 0 96px; opacity: 0; }
.photo { position: relative; border-radius: 22px; overflow: hidden; box-shadow: 0 30px 80px -20px rgba(16,24,40,.35); aspect-ratio: 3/2; }
.photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
.tag { position: absolute; left: 22px; top: 22px; background: #fff; border-radius: 10px; padding: 12px 18px; font-weight: 800; font-size: 34px; box-shadow: 0 10px 30px rgba(0,0,0,.2); }
.tag span { font-size: 20px; color: var(--muted); font-weight: 600; }
.stamp { position: absolute; right: 26px; bottom: 26px; border: 5px solid var(--bad); color: var(--bad); font-weight: 800; font-size: 30px; padding: 6px 16px; border-radius: 10px; transform: rotate(-8deg) scale(1.6); opacity: 0; background: rgba(255,255,255,.88); }
.stamp.on { animation: stamp 420ms var(--ease) forwards; }
@keyframes stamp { to { opacity: 1; transform: rotate(-8deg) scale(1); } }
.steps { display: grid; gap: 22px; }
.step { display: flex; gap: 20px; align-items: center; background: #fff; border: 1px solid #e3e8ef; border-radius: 18px; padding: 22px 26px; box-shadow: 0 8px 24px -12px rgba(16,24,40,.18); font-size: 26px; font-weight: 600; }
.step .n { flex: none; width: 54px; height: 54px; border-radius: 14px; display: grid; place-items: center; background: #fdecee; color: var(--bad); }
.step b { display: block; font-weight: 800; }
.step small { display: block; font-size: 19px; color: var(--muted); font-weight: 400; margin-top: 2px; }
</style></head><body>
<div class="brand"><svg width="30" height="30" viewBox="0 0 32 32"><path d="M16 3 3 13.5V29h26V13.5Z" fill="#006AFF"/><rect x="11" y="16" width="10" height="8" rx="1.6" fill="#fff"/><path d="M13 16v-2.4a3 3 0 0 1 6 0V16" stroke="#fff" stroke-width="2" fill="none"/></svg>Home Lock <small>for Zillow Rentals</small></div>
<div class="stage" id="hook"><div class="hook"><div class="in" style="animation-delay:.2s">Your home.</div><div class="in" style="animation-delay:1.1s">Listed for rent.</div><div class="in" style="animation-delay:2.2s">By someone else.</div></div></div>
<div class="scene" id="scene">
  <div class="photo pop" style="animation-delay:5.0s"><img src="maple-copied-1.jpg"><div class="tag">$1,200<span>/mo · for rent</span></div><div class="stamp" id="stamp">FAKE LISTING</div></div>
  <div class="steps">
    <div class="step in" style="animation-delay:6.2s"><span class="n"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4Z"/><circle cx="12" cy="13" r="3.5"/></svg></span><div><b>Photos copied</b><small>from the home's old sale listing</small></div></div>
    <div class="step in" style="animation-delay:8.6s"><span class="n"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12V3h9l9 9-9 9Z"/><circle cx="7.5" cy="7.5" r="1.5"/></svg></span><div><b>Priced far below market</b><small>too good to pass up</small></div></div>
    <div class="step in" style="animation-delay:10.6s"><span class="n"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M7 15h3"/></svg></span><div><b>Deposit by Zelle</b><small>before anyone sees the house</small></div></div>
  </div>
</div>
<script>
setTimeout(() => document.querySelector("#hook").classList.add("out"), 4300);
setTimeout(() => { document.querySelector("#scene").style.opacity = 1; }, 4800);
setTimeout(() => document.querySelector("#stamp").classList.add("on"), 12600);
</script></body></html>
